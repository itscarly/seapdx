<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87ceeb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0f6ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Sky background -->
  <rect width="64" height="64" rx="12" fill="url(#skyGradient)"/>
  <!-- Mt Rainier (left/Seattle) - taller, snow-capped -->
  <path d="M8 40L20 18L28 40Z" fill="#6b5344" stroke="#3d3226" stroke-width="0.5"/>
  <path d="M18 25L20 18L22 25Z" fill="#ffffff"/>
  <!-- Mt Hood (right/Portland) - slightly smaller -->
  <path d="M36 40L46 22L56 40Z" fill="#7a5c47" stroke="#3d3226" stroke-width="0.5"/>
  <path d="M44 28L46 22L48 28Z" fill="#ffffff"/>
  <!-- Foothills/valleys -->
  <path d="M4 40Q32 45 64 40" fill="#4a7c59" stroke="none"/>
  <!-- Pine trees accent (Seattle side) -->
  <line x1="14" y1="40" x2="14" y2="50" stroke="#2d5a3d" stroke-width="1"/>
  <line x1="52" y1="40" x2="52" y2="50" stroke="#2d5a3d" stroke-width="1"/>
</svg>
