name: Hotel Monitor

on:
  schedule:
    # Runs daily at 9 AM UTC. Date-gated cadence logic is inside the script:
    # Before Sep 1 2026  → Tue/Fri only
    # Sep 1–30 2026      → Mon only
    # Oct 1 2026+        → every day
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      force_run:
        description: "Force run regardless of cadence gating (set to 'true')"
        required: false
        default: "false"

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run hotel monitor
        id: monitor
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
          FORCE_RUN: ${{ github.event.inputs.force_run }}
        run: |
          node scripts/monitor-hotels.js
          cat research/hotels/latest-summary.json
          echo "alerts=$(node -e "const s=require('./research/hotels/latest-summary.json');console.log(s.totalAlerts||0)")" >> "$GITHUB_OUTPUT"
          echo "skipped=$(node -e "const s=require('./research/hotels/latest-summary.json');console.log(s.skipped||false)")" >> "$GITHUB_OUTPUT"

      - name: Upload hotel monitor report
        if: steps.monitor.outputs.skipped != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hotel-monitor-report
          path: |
            research/hotels/latest-report.md
            research/hotels/latest-summary.json

      - name: Commit updated report
        if: steps.monitor.outputs.skipped != 'true'
        run: |
          git config user.name "hotel-monitor[bot]"
          git config user.email "hotel-monitor[bot]@users.noreply.github.com"
          git add -f research/hotels/latest-report.md research/hotels/latest-summary.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update hotel monitor report $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Open GitHub issue when hotel qualifies under threshold
        if: steps.monitor.outputs.alerts != '0' && steps.monitor.outputs.skipped != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = JSON.parse(fs.readFileSync('research/hotels/latest-summary.json', 'utf8'));
            const report = fs.readFileSync('research/hotels/latest-report.md', 'utf8').slice(0, 60000);
            const cities = summary.cities.filter(c => c.alerts > 0).map(c => c.city).join(', ');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Hotel under threshold in ${cities} — review and consider rebooking`,
              labels: ['hotel-alert', 'action-required'],
              body: [
                '🏨 **A hotel has dropped below the alert threshold. Verify the live price and consider rebooking.**',
                '',
                `Checked: ${summary.today}`,
                `Cities with alerts: ${cities}`,
                '',
                '---',
                '',
                report
              ].join('\n')
            });
