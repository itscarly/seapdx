name: PAL Award Tax Monitor

on:
  schedule:
    # Runs daily at 8 AM UTC. Date-gated cadence logic is inside the script:
    # Before Sep 1 2026  → Mondays only
    # Sep 1–Dec 31 2026  → Mon/Wed/Fri only
    # Jan 1 2027+        → every day
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      force_run:
        description: "Force run regardless of cadence gating (set to 'true')"
        required: false
        default: "false"

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run PAL tax monitor
        id: monitor
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
          FORCE_RUN: ${{ github.event.inputs.force_run }}
        run: |
          node scripts/monitor-pal-taxes.js
          cat research/airfare/latest-summary.json
          echo "drops=$(node -e "const s=require('./research/airfare/latest-summary.json');console.log(s.drops||0)")" >> "$GITHUB_OUTPUT"
          echo "changes=$(node -e "const s=require('./research/airfare/latest-summary.json');console.log(s.changes||0)")" >> "$GITHUB_OUTPUT"
          echo "skipped=$(node -e "const s=require('./research/airfare/latest-summary.json');console.log(s.skipped||false)")" >> "$GITHUB_OUTPUT"

      - name: Upload PAL tax monitor report
        if: steps.monitor.outputs.skipped != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pal-tax-monitor-report
          path: |
            research/airfare/latest-report.md
            research/airfare/latest-summary.json
            data/airfare-watch.json

      - name: Commit updated snapshot and report
        if: steps.monitor.outputs.skipped != 'true'
        run: |
          git config user.name "pal-tax-monitor[bot]"
          git config user.email "pal-tax-monitor[bot]@users.noreply.github.com"
          git add -f data/airfare-watch.json research/airfare/latest-report.md research/airfare/latest-summary.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update PAL tax monitor report $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Open GitHub issue on tax change
        if: steps.monitor.outputs.changes != '0' && steps.monitor.outputs.skipped != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = JSON.parse(fs.readFileSync('research/airfare/latest-summary.json', 'utf8'));
            const report = fs.readFileSync('research/airfare/latest-report.md', 'utf8').slice(0, 60000);
            const drops = summary.drops || 0;
            const increases = summary.increases || 0;
            const title = drops > 0
              ? `PAL award tax DROPPED on ${summary.routeSummaries.filter(r => r.change < 0).map(r => r.label).join(', ')} — review now`
              : `PAL award tax changed (${increases} increase${increases !== 1 ? 's' : ''}) — ${summary.today}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: drops > 0 ? ['tax-drop', 'action-required'] : ['tax-change'],
              body: [
                drops > 0
                  ? '🔻 **PAL award tax dropped. Review before booking.**'
                  : '📊 PAL award tax changed.',
                '',
                `Checked: ${summary.today}`,
                `Routes: ${summary.routeSummaries.map(r => `${r.label} $${r.currentTax}`).join(' | ')}`,
                '',
                '---',
                '',
                report
              ].join('\n')
            });
