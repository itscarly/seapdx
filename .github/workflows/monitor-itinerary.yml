name: Monitor itinerary sources

on:
  schedule:
    - cron: "0 15 1 * *"
    - cron: "0 15 * 9,10,11 *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run itinerary monitor
        id: monitor
        run: |
          npm run monitor:itinerary
          cat research/pricing/latest-summary.json
          echo "changes=$(node -e "console.log(require('./research/pricing/latest-summary.json').changes)")" >> "$GITHUB_OUTPUT"

      - name: Upload monitor report
        uses: actions/upload-artifact@v4
        with:
          name: itinerary-monitor-report
          path: |
            research/pricing/latest-report.md
            research/pricing/latest-summary.json
            data/monitor-snapshot.json

      - name: Commit monitor snapshot and report
        if: always()
        run: |
          git config user.name "itinerary-monitor[bot]"
          git config user.email "itinerary-monitor[bot]@users.noreply.github.com"
          git add data/monitor-snapshot.json research/pricing/latest-report.md research/pricing/latest-summary.json
          if git diff --cached --quiet; then
            echo "No monitor file changes to commit."
          else
            git commit -m "Update itinerary monitor report"
            git push
          fi

      - name: Open issue when source changes are detected
        if: steps.monitor.outputs.changes != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = JSON.parse(fs.readFileSync('research/pricing/latest-summary.json', 'utf8'));
            const report = fs.readFileSync('research/pricing/latest-report.md', 'utf8').slice(0, 60000);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Itinerary monitor found ${summary.changes} source changes`,
              body: [
                'The scheduled itinerary monitor detected source changes.',
                '',
                'Review the report before changing route structure or budget assumptions.',
                '',
                report
              ].join('\n')
            });
